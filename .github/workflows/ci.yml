name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript compilers
        run: |
          test "$(pnpm exec tsc --version)" = "Version 7.0.2"
          pnpm exec tsc6 --version

      - name: Verify Nx project references
        run: pnpm exec nx sync:check

      - name: Run quality gates
        run: pnpm check

      - name: Run uncached build
        run: pnpm exec nx run-many -t build --skip-nx-cache

      - name: Export project graph
        run: pnpm exec nx graph --file=/tmp/orchestrator-project-graph.json
