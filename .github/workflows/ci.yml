name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript compiler
        run: test "$(pnpm exec tsc --version)" = "Version 7.0.2"

      - name: Run quality gates
        run: pnpm check

      - name: Build packages and CLI
        run: pnpm build

      - name: List workspace packages
        run: pnpm list --recursive --depth -1
